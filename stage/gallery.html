<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gallery | Ashley Meerloo</title>
  <meta name="description" content="Noir, Vivid, Sensual, Urban, Streets and Arts. Six collections of portrait, street and performance photography by Ashley Meerloo, East London.">
  <meta name="robots" content="noindex">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ashley Meerloo Photography">
  <meta property="og:title" content="The gallery | Ashley Meerloo">
  <meta property="og:description" content="Six collections of portrait, street and performance photography from East London.">
  <meta property="og:url" content="../stage/gallery.html">
  <meta property="og:image" content="../shared/og/stage.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A performer lit by coloured stage light, with the name Ashley Meerloo">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
  <link rel="stylesheet" href="stage.css">
  <script>document.documentElement.classList.add('js')</script>
  <script src="../shared/photos.js" defer></script>
  <script src="stage.js" defer></script>
  <script src="../shared/gallery.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header" data-header>
    <a class="wordmark" href="./">Ashley Meerloo</a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-btn>Menu</button>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <a href="gallery.html" aria-current="page">Gallery</a>
      <a href="./#sessions">Sessions</a>
      <a href="./#press">In public</a>
      <a href="./#about">About</a>
      <a class="site-nav__cta" href="./#contact">Book a session</a>
    </nav>
  </header>

  <main id="main" class="gallery" data-gallery data-base="../">
    <div class="gallery__head">
      <h1 class="gallery__title is-cue" data-title>Noir</h1>
      <blockquote class="gallery__quote">
        <p data-quote></p>
        <footer data-quote-by></footer>
      </blockquote>
      <nav class="g-tabs" data-tabs aria-label="Collections"></nav>
    </div>
    <p class="g-count" data-count></p>
    <ul class="g-grid" data-grid></ul>
  </main>

  <footer class="site-footer">
    <p class="site-footer__quote">“I don’t know where I’m going from here, but I promise it won’t be boring.” <span>David Bowie</span></p>
    <div class="site-footer__row">
      <nav class="social" aria-label="Social">
        <a href="https://instagram.com/aim.click.ldn">Instagram</a>
        <a href="https://facebook.com/ashley.meerloo">Facebook</a>
        <a href="https://twitter.com/AimClickLondon">X</a>
      </nav>
      <a class="text-link" href="./#contact">Book a portrait session</a>
      <p class="site-footer__small">© 2026 Ashley Meerloo</p>
    </div>
  </footer>

  <dialog class="lb" data-lightbox aria-label="Photo viewer">
    <div class="lb__top">
      <p class="lb__count" data-lb-count></p>
      <button class="lb__btn" type="button" data-lb-close>Close</button>
    </div>
    <figure class="lb__figure">
      <img data-lb-img alt="">
      <button class="lb__btn lb__nav lb__nav--prev" type="button" data-lb-prev>Previous</button>
      <button class="lb__btn lb__nav lb__nav--next" type="button" data-lb-next>Next</button>
    </figure>
    <p class="lb__cap" data-lb-cap></p>
  </dialog>
</body>
</html>
