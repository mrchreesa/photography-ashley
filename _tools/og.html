<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Share card template</title>
<!-- Rendered to shared/og/*.jpg by _tools/make_og.sh (1200x630, the size WhatsApp, iMessage and social apps expect). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400&family=Jost:wght@400;500&family=Anybody:wdth,wght@50..150,100..900&family=Newsreader:ital,opsz,wght@1,6..72,400&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #000; }
  .card { position: absolute; inset: 0; display: none; overflow: hidden; color: #ece8e1; }
  :target, .card.on { display: block; }

  /* Darkroom */
  .dr img { position: absolute; right: 0; top: 0; width: 700px; height: 630px; object-fit: cover; object-position: 66% 50%;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 35%); }
  .dr .dark { position: absolute; inset: 0; background: radial-gradient(circle 300px at 900px 330px, transparent 0%, rgba(0,0,0,.05) 40%, rgba(22,8,0,.66) 75%, rgba(10,3,0,.9) 100%); }
  .dr .glow { position: absolute; inset: 0; background: radial-gradient(55% 70% at 0% -10%, rgba(240,138,36,.32), transparent 70%); mix-blend-mode: screen; }
  .dr .txt { position: absolute; left: 72px; bottom: 80px; }
  .dr h1 { font: 400 92px/0.95 "Bodoni Moda", serif; margin: 0 0 22px; letter-spacing: -0.015em; }
  .dr p { font: italic 400 30px/1.3 "Bodoni Moda", serif; margin: 0 0 18px; color: #f4caa0; max-width: 560px; }
  .dr small { font: 400 22px/1.3 "Jost", sans-serif; color: #a9a39a; }

  /* Stage */
  .st { color: #fff6e8; }
  .st img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 52% 18%; filter: grayscale(1) contrast(1.2); }
  .st .gel { position: absolute; inset: 0; background: #ff2e8b; mix-blend-mode: color; }
  .st .dark { position: absolute; inset: 0; background: radial-gradient(ellipse 260px 300px at 640px 170px, transparent 80%, rgba(0,0,0,.7) 100%); }
  .st .beam { position: absolute; top: -20px; width: 900px; height: 1100px; translate: -50% 0; transform-origin: 50% 0; mix-blend-mode: screen; opacity: .35;
    background: conic-gradient(from 180deg at 50% 0, transparent -7deg, #ff9cc8 0deg, transparent 7deg);
    -webkit-mask-image: linear-gradient(#000, transparent 70%); }
  .st .b1 { left: 120px; rotate: -50deg; } .st .b2 { left: 1100px; rotate: 50deg; }
  .st .txt { position: absolute; left: 64px; right: 64px; bottom: 56px; }
  .st p { font: italic 400 38px/1 "Newsreader", serif; margin: 0 0 6px; }
  .st h1 { font: 900 112px/0.84 "Anybody", sans-serif; font-stretch: 100%; letter-spacing: -0.04em; margin: 0;
    text-shadow: 0 0 40px rgba(255,46,139,.55); white-space: nowrap; }

  /* Cover: both directions side by side */
  .cv .half { position: absolute; top: 0; bottom: 0; width: 600px; overflow: hidden; }
  .cv .l { left: 0; } .cv .r { right: 0; }
  .cv .l img { width: 100%; height: 100%; object-fit: cover; object-position: 66% 50%; }
  .cv .l .dark { position: absolute; inset: 0; background: radial-gradient(circle 260px at 400px 300px, transparent 0, rgba(22,8,0,.6) 75%, rgba(10,3,0,.88) 100%); }
  .cv .r img { width: 100%; height: 100%; object-fit: cover; object-position: 52% 20%; filter: grayscale(1) contrast(1.2); }
  .cv .r .gel { position: absolute; inset: 0; background: #ff2e8b; mix-blend-mode: color; }
  .cv .name { position: absolute; left: 0; right: 0; bottom: 60px; text-align: center; }
  .cv .name h1 { margin: 0; display: inline-block; padding: 18px 40px 22px; background: #000;
    font: 400 64px/1 "Bodoni Moda", serif; color: #ece8e1; }
  .cv .name p { margin: 0; display: inline-block; padding: 0 22px 14px; background: #000; font: 500 24px/1 "Jost", sans-serif; color: #a9a39a; }
  .cv .name { display: grid; justify-items: center; }
</style>
</head>
<body>
  <section class="card dr" id="darkroom">
    <img src="../shared/img/polly-floor-1600.webp" alt="">
    <div class="dark"></div><div class="glow"></div>
    <div class="txt">
      <h1>Ashley<br>Meerloo</h1>
      <p>It’s only in the dark that things shine brightest.</p>
      <small>Portrait photographer, East London</small>
    </div>
  </section>

  <section class="card st" id="stage">
    <img src="../shared/img/emotion-960.webp" alt="">
    <div class="gel"></div><div class="dark"></div>
    <span class="beam b1"></span><span class="beam b2"></span>
    <div class="txt">
      <p>Portraits with drama, East London</p>
      <h1>Ashley Meerloo</h1>
    </div>
  </section>

  <section class="card cv" id="cover">
    <div class="half l"><img src="../shared/img/polly-floor-1600.webp" alt=""><div class="dark"></div></div>
    <div class="half r"><img src="../shared/img/emotion-960.webp" alt=""><div class="gel"></div></div>
    <div class="name"><h1>Ashley Meerloo</h1><p>Two directions for the new website</p></div>
  </section>
  <script>
    const id = location.hash.slice(1) || 'darkroom';
    document.getElementById(id).classList.add('on');
  </script>
</body>
</html>
